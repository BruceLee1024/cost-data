[project]
name = "cost-data"
version = "0.1.0"
description = "Local-first personal construction cost database"
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic==1.18.5",
  "fastapi==0.140.0",
  "httpx==0.28.1",
  "keyring==25.7.0",
  "xlrd==2.0.2",
  "openpyxl==3.1.5",
  "pydantic-settings==2.11.0",
  "python-multipart==0.0.20",
  "rapidfuzz==3.14.3",
  "sqlalchemy==2.0.51",
  "uvicorn[standard]==0.38.0",
]

[dependency-groups]
dev = [
  "pytest==9.0.2",
  "pytest-asyncio==1.3.0",
  "pytest-cov==7.0.0",
]
packaging = ["pyinstaller==6.21.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cost_data"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-warnings --maxfail=1"

[tool.coverage.run]
source = ["cost_data"]
